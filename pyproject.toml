[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marathon"
version = "0.0.1"
description = "Delta-encoded context architecture for LLMs: per-turn cost proportional to what changed, not total context size."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Crosley" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
live = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/marathon"]

[tool.pytest.ini_options]
# ponytail: pythonpath beats requiring `pip install -e .` before a bare `pytest`
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
